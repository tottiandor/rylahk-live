name: live
# During games it stays on, polling Fantrax every minute, for up to 5.5 hours. GitHub's
# timer is throttled to a few runs a day, so it is only a backup: a run that ends while
# another kickoff is less than 4 hours away starts the next run itself, and injuries/bot
# start it too when a game is near. A run that starts early waits for the window.
# Only one runs at a time.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      replay:
        description: 'Replay a finished round as a test (round number; empty = normal run)'
        required: false
      send:
        description: 'Send the replay to Telegram too'
        type: boolean
        default: false

concurrency:
  group: live
  cancel-in-progress: false

permissions:
  contents: write
  actions: write          # to start the next run itself

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: watch
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMIT_STATE: '1'
          PYTHONUTF8: '1'
        run: |
          git config user.name "rylahk-live bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -z "$TELEGRAM_BOT_TOKEN" ] && [ -z "${{ inputs.replay }}" ]; then echo "Telegram not connected yet (run setup_telegram.py)"; exit 0; fi
          if [ -n "${{ inputs.replay }}" ]; then
            python live.py --replay "${{ inputs.replay }}" ${{ inputs.send && '--send' || '' }}
          else
            python live.py
          fi
      - name: start the next run
        # only after a clean run (a crash must not loop), never after a replay
        if: success() && !inputs.replay
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUTF8: '1'
        run: |
          if python live.py --due 240; then gh workflow run live.yml && echo "next live run started"; else echo "no game within 4 hours"; fi

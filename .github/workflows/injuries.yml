name: injuries
# FPL and Fantrax injury news for rostered players, checked every 10 minutes.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: injuries
  cancel-in-progress: false

permissions:
  contents: write
  actions: write          # to start the live feed when GitHub's timer has not

jobs:
  injuries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMIT_STATE: '1'
          PYTHONUTF8: '1'
        run: |
          git config user.name "rylahk-live bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then echo "Telegram not connected yet (run setup_telegram.py)"; exit 0; fi
          python injuries.py
      - name: make sure the live feed is on
        # GitHub's timer may not start the live feed in time: start it from here when a
        # game is less than 4 hours away and no live run is going
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUTF8: '1'
        run: |
          if python live.py --due 240; then
            n=$(gh run list --workflow live.yml --limit 20 --json status --jq '[.[] | select(.status != "completed")] | length')
            if [ "$n" = "0" ]; then gh workflow run live.yml && echo "started the live feed"; else echo "live feed already on"; fi
          fi

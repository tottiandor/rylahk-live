name: bot
# Answers /add, /team, /list and /remove in Telegram. Every 5 minutes (GitHub may be late).
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: bot
  cancel-in-progress: false

permissions:
  contents: write
  actions: write          # to start the live feed when GitHub's timer has not

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMIT_STATE: '1'
          PYTHONUTF8: '1'
        run: |
          git config user.name "rylahk-live bot"
          git config user.email "actions@users.noreply.github.com"
          python bot.py
      - name: make sure the live feed is on
        # GitHub's timer may not start the live feed in time: start it from here when a
        # game is less than 4 hours away and no live run is going
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUTF8: '1'
        run: |
          if python live.py --due 240; then
            n=$(gh run list --workflow live.yml --limit 20 --json status --jq '[.[] | select(.status != "completed")] | length')
            if [ "$n" = "0" ]; then gh workflow run live.yml && echo "started the live feed"; else echo "live feed already on"; fi
          fi
